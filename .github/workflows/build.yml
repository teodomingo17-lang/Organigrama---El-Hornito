name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Crear proyecto Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/share@7 @capacitor/filesystem@7
          npx cap init "Organigrama Extendido" com.hornito.organigrama --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Poner el logo como icono de la app
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $p
            convert logo.png -resize $2x$2 $R/mipmap-$1/ic_launcher.png
            cp $R/mipmap-$1/ic_launcher.png $R/mipmap-$1/ic_launcher_round.png
          done
          rm -rf $R/mipmap-anydpi-v26

      - name: Ignorar el tamano de letra del celular
        run: |
          cat > android/app/src/main/java/com/hornito/organigrama/MainActivity.java <<'JAVA'
          package com.hornito.organigrama;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().getSettings().setTextZoom(100);
              }
          }
          JAVA

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: organigrama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
